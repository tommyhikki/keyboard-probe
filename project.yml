name: KeyboardProbe
options:
  bundleIdPrefix: dev.probe
  deploymentTarget:
    iOS: "17.0"
targets:
  KeyboardProbe:
    type: application
    platform: iOS
    sources:
      - KeyboardProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.probe.KeyboardProbe
        GENERATE_INFOPLIST_FILE: YES
        # これが無いと互換モード(古い画面サイズ扱い)で起動して、pt幅が狂う
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
